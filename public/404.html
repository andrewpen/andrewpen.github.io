<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Andrew Pendleton</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        color: #fff;
        text-align: center;
        padding: 1.5rem;
      }
      .monogram {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #4f46e5, #3b82f6);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        margin-bottom: 1.5rem;
      }
      h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
      p { color: #cbd5e1; margin-bottom: 2rem; }
      a.home {
        display: inline-block;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        background: #fff;
        color: #0f172a;
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s;
      }
      a.home:hover, a.home:focus-visible { background: #e0e7ff; }
    </style>
  </head>
  <body>
    <main>
      <div class="monogram" aria-hidden="true">AP</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="home" href="/">Back to the home page</a>
    </main>
  </body>
</html>
